; =============================================================================
; kirimemail/frankenphp-extended - development overrides
; Installed only in the Alpine ("Development") variant as:
;   /usr/local/etc/php/conf.d/zz-dev.ini
;
; The `zz-` prefix makes it load after 99-custom.ini, re-enabling the
; developer-facing output that the hardened shared config switches off.
; Do not copy this file into a production image.
; =============================================================================

display_errors             = On
display_startup_errors     = On
html_errors                = On
zend.exception_ignore_args = Off

; OPcache stays enabled (same as production) so opcache-related bugs
; surface in development, but timestamp validation is re-enabled here
; (production disables it) and rechecked on every request so edited files
; take effect immediately without a restart.
opcache.enable              = 1
opcache.enable_cli          = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq     = 0
; File-override must stay off here: with validation on, file_exists() must
; hit disk so new/deleted files are seen immediately.
opcache.enable_file_override = 0
