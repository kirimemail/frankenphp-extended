; =============================================================================
; kirimemail/frankenphp-extended - shared PHP configuration / hardening
; Installed as: /usr/local/etc/php/conf.d/99-custom.ini (all variants)
;
; Override order (later wins):
;   1. this file
;   2. any conf.d/*.ini sorting after "99-custom" (e.g. zz-dev.ini in Alpine)
;   3. `php_ini <key> <value>` inside the Caddyfile `frankenphp` block
; =============================================================================

; --- Resource limits ---------------------------------------------------------
upload_max_filesize = 24M
post_max_size       = 32M
max_file_uploads    = 20
memory_limit        = 256M
max_execution_time  = 300
max_input_time      = 300
max_input_vars      = 1000

; --- Information disclosure --------------------------------------------------
; Never advertise the PHP version (drops the X-Powered-By response header).
expose_php = Off
; Never render errors into a response body: stack traces leak absolute paths,
; DSNs and credentials. Errors still go to stderr, so `docker logs` shows them.
display_errors         = Off
display_startup_errors = Off
html_errors            = Off
log_errors             = On
error_reporting        = E_ALL
error_log              = /dev/stderr
; Do not copy function arguments (passwords, tokens) into exception traces.
zend.exception_ignore_args = On
; Do not leak the PHP binary path in mail headers.
mail.add_x_header = Off

; --- Code execution / input trust -------------------------------------------
; Streaming remote files stays available (needed by Composer and many apps),
; but remote code is never included and executed.
allow_url_fopen   = On
allow_url_include = Off
; Runtime-loaded native code, writable PHARs and FFI are elevated-risk.
enable_dl     = Off
phar.readonly = On
ffi.enable    = Off
; Ignore per-directory .user.ini files: configuration must not be settable
; from the application's docroot.
user_ini.filename = ""

; --- OPcache -----------------------------------------------------------------
; opcache is compiled into the base FrankenPHP image; these settings turn it
; on and tune it. FrankenPHP keeps PHP workers alive between requests, so a
; warm OPcache is shared instead of recompiled per request.
; `enable_file_override` lets file_exists()/is_file() hit the OPcache index
; instead of stat()ing disk - a measurable win for framework autoloaders.
; validate_timestamps is Off for maximum production throughput: opcodes are
; cached permanently and code updates require a container restart (or
; `opcache_reset()` / `opcache_invalidate()`). The Alpine dev variant
; re-enables timestamp validation via zz-dev.ini so edits apply immediately.
opcache.enable              = 1
opcache.enable_cli          = 1
opcache.memory_consumption  = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files   = 20000
opcache.max_wasted_percentage   = 10
opcache.optimization_level       = -1
opcache.enable_file_override    = 1
opcache.validate_timestamps     = 0
opcache.revalidate_freq         = 2
opcache.file_update_protection  = 2
opcache.jit                 = tracing
opcache.jit_buffer_size     = 128M

; --- Realpath cache ----------------------------------------------------------
; PHP resolves every include/require through the realpath cache. Frameworks
; with thousands of files (Symfony/Laravel) exhaust the tiny 16K default,
; causing a stat() storm on every request. 4096K + 600s TTL matches the
; OPcache posture above: restart the container on deploy to refresh.
realpath_cache_size = 4096K
realpath_cache_ttl  = 600

; --- Runtime / output --------------------------------------------------------
; Buffer templated output into 4K chunks instead of one write() syscall per
; echo, and never flush implicitly mid-request (FrankenPHP streams via its
; own worker loop). pcre.jit stays on: the regex JIT is pure CPU win.
output_buffering = 4096
implicit_flush   = Off
pcre.jit         = 1

; --- Sessions ---------------------------------------------------------------
session.use_strict_mode  = 1
session.use_only_cookies = 1
session.use_trans_sid    = 0
session.cookie_httponly  = 1
session.cookie_samesite  = Lax
; Upload progress lets a client write attacker-chosen keys into the session
; store on every request - a cheap session-flooding/DoS vector for an API or
; app that never consumes it.
session.upload_progress.enabled = 0
; session.cookie_secure stays 0 so plain-HTTP local development keeps working.
; Set it to 1 in the application config when the container is only reached
; over HTTPS (FrankenPHP terminates TLS for the hosts in your Caddyfile).
; igbinary ships in every variant: binary session encoding is faster and
; smaller than the default php serializer. Note: flips the session encoding,
; so pre-existing sessions reset once on the first deploy after enabling.
session.serialize_handler = igbinary
igbinary.compact_strings  = On
