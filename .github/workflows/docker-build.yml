name: Build and Push Docker Images

on:
  workflow_dispatch: # Manual trigger option
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
    paths:
      - "Dockerfile.*"
      - "docker/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Dockerfile.*"
      - "docker/**"
      - ".github/workflows/docker-build.yml"

env:
  DOCKER_HUB_ORGANIZATION: kirimemail
  IMAGE_NAME: frankenphp-extended

# A newer push for the same ref cancels an outdated build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # One native runner per architecture: no QEMU, so the PHP extensions are
    # compiled at native speed (arm64 runners are free for public repos).
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        php-tag: [php83, php84, php85]
        variant: [alpine, ""]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runs-on: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runs-on: ubuntu-24.04-arm
            platform: linux/arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Prepare names
        id: prep
        env:
          PHP_TAG: ${{ matrix.php-tag }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$VARIANT" ]; then
            SLUG="${PHP_TAG}-${VARIANT}"
            DOCKERFILE="Dockerfile.${PHP_TAG}.${VARIANT}"
          else
            SLUG="${PHP_TAG}-debian"
            DOCKERFILE="Dockerfile.${PHP_TAG}"
          fi
          REPO="${DOCKER_HUB_ORGANIZATION}/${IMAGE_NAME}"
          # Cache scopes are per image and architecture: a single shared
          # scope made the builds evict each other on every run.
          SCOPE="${SLUG}-${ARCH}"
          if [ "$EVENT" = "pull_request" ]; then
            OUTPUTS="type=cacheonly"
          else
            OUTPUTS="type=image,name=${REPO}"
            OUTPUTS="${OUTPUTS},push-by-digest=true"
            OUTPUTS="${OUTPUTS},name-canonical=true,push=true"
          fi
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=${DOCKERFILE}" >> "$GITHUB_OUTPUT"
          echo "scope=${SCOPE}" >> "$GITHUB_OUTPUT"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"
          echo "outputs=${OUTPUTS}" >> "$GITHUB_OUTPUT"

      - name: Build image for ${{ matrix.platform }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.prep.outputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          # Digest-only push: the merge job assembles the multi-arch tag.
          outputs: ${{ steps.prep.outputs.outputs }}
          cache-from: type=gha,scope=${{ steps.prep.outputs.scope }}
          cache-to: type=gha,mode=min,scope=${{ steps.prep.outputs.scope }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.prep.outputs.slug }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    # Combines the per-architecture digests into one multi-arch manifest per
    # tag, so `docker pull` keeps working on amd64 and arm64 hosts alike.
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        php-tag: [php83, php84, php85]
        variant: [alpine, ""]

    steps:
      - name: Prepare tag
        id: prep
        env:
          PHP_TAG: ${{ matrix.php-tag }}
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ -n "$VARIANT" ]; then
            PREFIX="${PHP_TAG}-${VARIANT}"
            echo "tag=${PREFIX}" >> "$GITHUB_OUTPUT"
          else
            PREFIX="${PHP_TAG}-debian"
            echo "tag=${PHP_TAG}" >> "$GITHUB_OUTPUT"
          fi
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ steps.prep.outputs.prefix }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          REPO="${DOCKER_HUB_ORGANIZATION}/${IMAGE_NAME}"
          TAG="${{ steps.prep.outputs.tag }}"
          refs=()
          for digest in *; do
            refs+=("${REPO}@sha256:${digest}")
          done
          docker buildx imagetools create -t "${REPO}:${TAG}" \
            "${refs[@]}"

      - name: Verify manifest
        run: |
          REPO="${DOCKER_HUB_ORGANIZATION}/${IMAGE_NAME}"
          docker buildx imagetools inspect \
            "${REPO}:${{ steps.prep.outputs.tag }}"
